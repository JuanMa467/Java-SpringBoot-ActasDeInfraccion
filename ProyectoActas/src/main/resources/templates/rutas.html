<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><title>Rutas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>body{background:#f0f2f5}.sidebar{min-height:100vh;background:#1a2332}.sidebar .nav-link{color:#adb5bd;border-radius:8px;margin:2px 8px;transition:all .2s}.sidebar .nav-link:hover,.sidebar .nav-link.active{background:#0d6efd;color:#fff}.brand{color:#fff;font-weight:700;font-size:1.1rem;border-bottom:1px solid #2d3f57}.content-area{padding:2rem}.table th{font-size:.8rem;text-transform:uppercase;color:#6c757d;background:#f8f9fa}</style>
</head>
<body>
<div class="d-flex">
<div class="sidebar d-flex flex-column p-3" style="width:240px;min-width:240px">
<div class="brand p-2 mb-3"><i class="bi bi-file-earmark-text me-2"></i>Sistema de Actas</div>
<nav class="nav flex-column gap-1">
<a href="/" class="nav-link"><i class="bi bi-house me-2"></i>Inicio</a>
<a href="/actas" class="nav-link"><i class="bi bi-file-text me-2"></i>Actas</a>
<a href="/conductores" class="nav-link"><i class="bi bi-person me-2"></i>Conductores</a>
<a href="/vehiculos" class="nav-link"><i class="bi bi-car-front me-2"></i>Vehículos</a>
<a href="/infracciones" class="nav-link"><i class="bi bi-exclamation-triangle me-2"></i>Infracciones</a>
<a href="/rutas" class="nav-link active"><i class="bi bi-signpost me-2"></i>Rutas</a>
<hr class="border-secondary"><small class="text-secondary px-2 mb-1">Configuración</small>
<a href="/marcas" class="nav-link"><i class="bi bi-tag me-2"></i>Marcas</a>
<a href="/modelos" class="nav-link"><i class="bi bi-gear me-2"></i>Modelos</a>
<a href="/licencias" class="nav-link"><i class="bi bi-card-text me-2"></i>Licencias</a>
<a href="/organizaciones" class="nav-link"><i class="bi bi-building me-2"></i>Organizaciones</a>
<a href="/autoridades" class="nav-link"><i class="bi bi-shield me-2"></i>Autoridades</a>
<a href="/tipos-infraccion" class="nav-link"><i class="bi bi-list-check me-2"></i>Tipos de Infracción</a>
<a href="/tipos-ruta" class="nav-link"><i class="bi bi-map me-2"></i>Tipos de Ruta</a>
</nav></div>
<div class="flex-grow-1 content-area">
<div class="d-flex justify-content-between align-items-center mb-4">
<div><h2 class="fw-bold mb-0">Rutas</h2><p class="text-muted mb-0">Gestión de rutas</p></div>
<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm"><i class="bi bi-plus-lg me-1"></i>Nueva Ruta</button>
</div>
<div id="alerta" class="d-none"></div>
<div class="card border-0 shadow-sm rounded-3"><div class="card-body p-0">
<div class="p-3 border-bottom"><input id="busqueda" type="text" class="form-control form-control-sm w-auto" placeholder="Buscar por nombre..."></div>
<div class="table-responsive"><table class="table table-hover align-middle mb-0">
<thead><tr><th class="ps-3">ID</th><th>Nombre</th><th>KM</th><th>Tipo</th><th>Acciones</th></tr></thead>
<tbody id="tablaData"><tr><td colspan="5" class="text-center py-4 text-muted">Cargando...</td></tr></tbody>
</table></div></div></div></div></div>
<div class="modal fade" id="modalForm" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title fw-bold" id="tituloModal"><i class="bi bi-signpost me-2"></i>Nueva Ruta</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><input type="hidden" id="itemId"><div class="row g-3">
<div class="col-md-8"><label class="form-label fw-semibold">Nombre de Ruta</label><input type="text" id="nombreRuta" class="form-control" placeholder="Ej: Ruta Nacional 40"></div>
<div class="col-md-4"><label class="form-label fw-semibold">KM</label><input type="text" id="kmRuta" class="form-control" placeholder="Ej: 150"></div>
<div class="col-12"><label class="form-label fw-semibold">Tipo de Ruta</label><select id="selectTipoRuta" class="form-select"><option value="">-- Seleccionar tipo --</option></select></div>
</div></div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="btnGuardar"><i class="bi bi-save me-1"></i>Guardar</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API='http://localhost:9000/api/v1';let datos=[];
function alerta(msg,t='success'){const a=document.getElementById('alerta');a.className=`alert alert-${t} alert-dismissible fade show`;a.innerHTML=msg+`<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;}
async function cargar(){try{const r=await fetch(`${API}/Rutas`);datos=await r.json();renderTabla(datos);}catch{document.getElementById('tablaData').innerHTML='<tr><td colspan="5" class="text-center text-danger py-4">Error al conectar con la API.</td></tr>';}}
function renderTabla(arr){const t=document.getElementById('tablaData');if(!arr.length){t.innerHTML='<tr><td colspan="5" class="text-center py-4 text-muted">No hay rutas</td></tr>';return;}
t.innerHTML=arr.map(r=>`<tr><td class="ps-3 text-muted small">#${r.id}</td><td><strong>${r.nombreRuta||'-'}</strong></td><td>${r.kmRuta||'-'}</td><td>${r.tipoRuta?r.tipoRuta.nombreTipoDeRuta:'-'}</td><td><button class="btn btn-sm btn-outline-warning me-1" onclick="editar(${r.id})"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger" onclick="eliminar(${r.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('');}
async function cargarTipos(){try{const r=await fetch(`${API}/TipoRutas`);const tipos=await r.json();const s=document.getElementById('selectTipoRuta');tipos.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.nombreTipoDeRuta;s.appendChild(o);});}catch{}}
function editar(id){const r=datos.find(x=>x.id===id);if(!r)return;document.getElementById('itemId').value=r.id;document.getElementById('nombreRuta').value=r.nombreRuta||'';document.getElementById('kmRuta').value=r.kmRuta||'';document.getElementById('selectTipoRuta').value=r.tipoRuta?r.tipoRuta.id:'';document.getElementById('tituloModal').innerHTML='<i class="bi bi-pencil me-2"></i>Editar Ruta';new bootstrap.Modal(document.getElementById('modalForm')).show();}
document.getElementById('modalForm').addEventListener('hidden.bs.modal',()=>{document.getElementById('itemId').value='';document.getElementById('tituloModal').innerHTML='<i class="bi bi-signpost me-2"></i>Nueva Ruta';['nombreRuta','kmRuta'].forEach(id=>document.getElementById(id).value='');document.getElementById('selectTipoRuta').value='';});
document.getElementById('btnGuardar').addEventListener('click',async()=>{const editId=document.getElementById('itemId').value;const body={nombreRuta:document.getElementById('nombreRuta').value,kmRuta:document.getElementById('kmRuta').value,tipoRuta:document.getElementById('selectTipoRuta').value?{id:parseInt(document.getElementById('selectTipoRuta').value)}:null};const url=editId?`${API}/Rutas/${editId}`:`${API}/Rutas`;const method=editId?'PUT':'POST';try{const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){bootstrap.Modal.getInstance(document.getElementById('modalForm')).hide();alerta(`Ruta ${editId?'actualizada':'creada'}.`);cargar();}else{alerta('Error.','danger');}}catch{alerta('Error de conexión.','danger');}});
async function eliminar(id){if(!confirm('¿Eliminar?'))return;try{await fetch(`${API}/Rutas/${id}`,{method:'DELETE'});alerta('Ruta eliminada.');cargar();}catch{alerta('Error.','danger');}}
document.getElementById('busqueda').addEventListener('input',function(){const q=this.value.toLowerCase();renderTabla(datos.filter(r=>(r.nombreRuta||'').toLowerCase().includes(q)));});
cargar();cargarTipos();
</script>
</body></html>
