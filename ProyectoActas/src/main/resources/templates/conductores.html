<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conductores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { min-height: 100vh; background: #1a2332; }
        .sidebar .nav-link { color: #adb5bd; border-radius: 8px; margin: 2px 8px; transition: all .2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #0d6efd; color: #fff; }
        .brand { color: #fff; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid #2d3f57; }
        .content-area { padding: 2rem; }
        .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; background: #f8f9fa; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar d-flex flex-column p-3" style="width: 240px; min-width:240px;">
        <div class="brand p-2 mb-3"><i class="bi bi-file-earmark-text me-2"></i>Sistema de Actas</div>
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link"><i class="bi bi-house me-2"></i>Inicio</a>
            <a href="/actas" class="nav-link"><i class="bi bi-file-text me-2"></i>Actas</a>
            <a href="/conductores" class="nav-link active"><i class="bi bi-person me-2"></i>Conductores</a>
            <a href="/vehiculos" class="nav-link"><i class="bi bi-car-front me-2"></i>Vehículos</a>
            <a href="/infracciones" class="nav-link"><i class="bi bi-exclamation-triangle me-2"></i>Infracciones</a>
            <a href="/rutas" class="nav-link"><i class="bi bi-signpost me-2"></i>Rutas</a>
            <hr class="border-secondary">
            <small class="text-secondary px-2 mb-1">Configuración</small>
            <a href="/marcas" class="nav-link"><i class="bi bi-tag me-2"></i>Marcas</a>
            <a href="/modelos" class="nav-link"><i class="bi bi-gear me-2"></i>Modelos</a>
            <a href="/licencias" class="nav-link"><i class="bi bi-card-text me-2"></i>Licencias</a>
            <a href="/organizaciones" class="nav-link"><i class="bi bi-building me-2"></i>Organizaciones</a>
            <a href="/autoridades" class="nav-link"><i class="bi bi-shield me-2"></i>Autoridades</a>
            <a href="/tipos-infraccion" class="nav-link"><i class="bi bi-list-check me-2"></i>Tipos de Infracción</a>
            <a href="/tipos-ruta" class="nav-link"><i class="bi bi-map me-2"></i>Tipos de Ruta</a>
        </nav>
    </div>

    <div class="flex-grow-1 content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Conductores</h2>
                <p class="text-muted mb-0">Gestión de conductores registrados</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalConductor">
                <i class="bi bi-plus-lg me-1"></i>Nuevo Conductor
            </button>
        </div>

        <div id="alerta" class="d-none"></div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="p-3 border-bottom">
                    <input id="busqueda" type="text" class="form-control form-control-sm w-auto" placeholder="Buscar por nombre, apellido o DNI...">
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>DNI</th>
                                <th>Género</th>
                                <th>Domicilio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConductores">
                            <tr><td colspan="7" class="text-center py-4 text-muted">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Conductor -->
<div class="modal fade" id="modalConductor" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="tituloModal"><i class="bi bi-person-plus me-2"></i>Nuevo Conductor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="conductorId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Apellido</label>
                        <input type="text" id="apellido" class="form-control" placeholder="Apellido">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">DNI</label>
                        <input type="number" id="dni" class="form-control" placeholder="Número de DNI">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Género</label>
                        <select id="genero" class="form-select">
                            <option value="">-- Seleccionar --</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="X">No binario</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Domicilio</label>
                        <input type="text" id="domicilio" class="form-control" placeholder="Domicilio completo">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardar"><i class="bi bi-save me-1"></i>Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'http://localhost:9000/api/v1';
let datos = [];

function mostrarAlerta(msg, tipo = 'success') {
    const a = document.getElementById('alerta');
    a.className = `alert alert-${tipo} alert-dismissible fade show`;
    a.innerHTML = msg + `<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
}

async function cargar() {
    try {
        const r = await fetch(`${API}/Conductores`);
        datos = await r.json();
        renderTabla(datos);
    } catch {
        document.getElementById('tablaConductores').innerHTML =
            '<tr><td colspan="7" class="text-center text-danger py-4">Error al conectar con la API.</td></tr>';
    }
}

function renderTabla(arr) {
    const tbody = document.getElementById('tablaConductores');
    if (!arr.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No hay conductores registrados</td></tr>';
        return;
    }
    tbody.innerHTML = arr.map(c => `
        <tr>
            <td class="ps-3 text-muted small">#${c.id}</td>
            <td>${c.nombre || '-'}</td>
            <td>${c.apellido || '-'}</td>
            <td><code>${c.dni || '-'}</code></td>
            <td>${c.genero || '-'}</td>
            <td>${c.domicilio || '-'}</td>
            <td>
                <button class="btn btn-sm btn-outline-warning me-1" onclick="editarConductor(${c.id})"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${c.id})"><i class="bi bi-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

function editarConductor(id) {
    const c = datos.find(x => x.id === id);
    if (!c) return;
    document.getElementById('conductorId').value = c.id;
    document.getElementById('nombre').value = c.nombre || '';
    document.getElementById('apellido').value = c.apellido || '';
    document.getElementById('dni').value = c.dni || '';
    document.getElementById('genero').value = c.genero || '';
    document.getElementById('domicilio').value = c.domicilio || '';
    document.getElementById('tituloModal').innerHTML = '<i class="bi bi-pencil me-2"></i>Editar Conductor';
    new bootstrap.Modal(document.getElementById('modalConductor')).show();
}

document.getElementById('modalConductor').addEventListener('hidden.bs.modal', () => {
    document.getElementById('conductorId').value = '';
    document.getElementById('tituloModal').innerHTML = '<i class="bi bi-person-plus me-2"></i>Nuevo Conductor';
    ['nombre','apellido','dni','genero','domicilio'].forEach(id => document.getElementById(id).value = '');
});

document.getElementById('btnGuardar').addEventListener('click', async () => {
    const editId = document.getElementById('conductorId').value;
    const body = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        dni: parseInt(document.getElementById('dni').value) || 0,
        genero: document.getElementById('genero').value,
        domicilio: document.getElementById('domicilio').value,
    };
    const url = editId ? `${API}/Conductores/${editId}` : `${API}/Conductores`;
    const method = editId ? 'PUT' : 'POST';
    try {
        const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (r.ok) {
            bootstrap.Modal.getInstance(document.getElementById('modalConductor')).hide();
            mostrarAlerta(`Conductor ${editId ? 'actualizado' : 'creado'} correctamente.`);
            cargar();
        } else { mostrarAlerta('Error al guardar.', 'danger'); }
    } catch { mostrarAlerta('No se pudo conectar con la API.', 'danger'); }
});

async function eliminar(id) {
    if (!confirm('¿Eliminar este conductor?')) return;
    try {
        await fetch(`${API}/Conductores/${id}`, { method: 'DELETE' });
        mostrarAlerta('Conductor eliminado.');
        cargar();
    } catch { mostrarAlerta('Error al eliminar.', 'danger'); }
}

document.getElementById('busqueda').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    renderTabla(datos.filter(c =>
        (c.nombre || '').toLowerCase().includes(q) ||
        (c.apellido || '').toLowerCase().includes(q) ||
        String(c.dni).includes(q)
    ));
});

cargar();
</script>
</body>
</html>
